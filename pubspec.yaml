name: xfy_mobile
description: "XFY — Application mobile vendeur e-commerce Tunisie."
publish_to: 'none'
version: 1.5.1+9

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  stomp_dart_client: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logoXFY_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logoXFY_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
